name: Deploy site

on:
  push:
    branches: [master]
  # Weekly, so the projects' stars and languages from GitHub stay fresh.
  schedule:
    - cron: "17 5 * * 1"
  # And by hand: Actions → Deploy site → Run workflow.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Google Analytics 4, from the repository's Actions variables (Settings →
      # Secrets and variables → Actions → Variables). Left unset, nothing is tracked.
      PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
      # Read-only, for the projects' stars and languages without rate limits.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm (the version in package.json)
        uses: pnpm/action-setup@v4

      - name: Set up Node (the version in .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Types only: `pnpm check` would also audit and build, and the build comes next.
      # An advisory against a dependency should not stop a weekly redeploy either; the
      # audit belongs to `pnpm check` before committing.
      - name: Check types
        run: pnpm exec astro check

      - name: Build site with all versions
        run: bash scripts/build-site.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
