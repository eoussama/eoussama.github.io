name: Deploy site

on:
  push:
    branches: [master]
  # Weekly, so the projects' stars and languages from GitHub, and the short links from
  # the redirector repository, stay fresh.
  schedule:
    - cron: "17 5 * * 1"
  # And by hand: Actions → Deploy site → Run workflow.
  workflow_dispatch:

# Read-only by default; only the deploy job may publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For Configure Pages, which reads the site's Pages settings.
      pages: read
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Nothing after this pushes or fetches; the build only reads the local history.
          persist-credentials: false

      - name: Set up pnpm (the version in package.json)
        uses: pnpm/action-setup@v6

      - name: Set up Node (the version in .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Types only: `pnpm check` would also audit and build, and the build comes next.
      # An advisory against a dependency should not stop a weekly redeploy either; the
      # audit belongs to `pnpm check` before committing.
      - name: Check types
        run: pnpm exec astro check

      - name: Build site with all versions
        run: bash scripts/build-site.sh
        env:
          # Google Analytics 4, from the repository's Actions variables (Settings →
          # Secrets and variables → Actions → Variables). Left unset, nothing is tracked.
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          # Read-only; lifts the GitHub API's rate limit for the short links and the
          # projects' stats. Only this step gets it, and the installs inside it, the
          # archived versions' included, run no install scripts: npm is told to skip
          # them, and pnpm skips them unless the project allows some, which none does.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # Dot-folders are left out by default, and public/.well-known (security.txt)
          # is one. The archived versions' stray editor files are removed by the build.
          include-hidden-files: true

  deploy:
    needs: build
    # A run started by hand from another branch builds, as a check, but never publishes.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
