name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: [bug]
type: Bug
assignees:
  - eoussama
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: input
    id: page
    attributes:
      label: Page
      description: Which page is it on? The version shows in the header's version menu.
      placeholder: ex. https://ouss.es/p/fr/blog/string-manipulation/, v0.5
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where are you seeing the problem? Include the theme (light or dark) and the screen size if it matters.
      placeholder: ex. macOS 15, Chrome 130, dark theme, a phone-sized window
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant output from the browser's console. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/eoussama/eoussama.github.io/blob/master/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
