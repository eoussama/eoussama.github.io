  en: "An offline-first workshop app for solo tailors: clients, measurements, orders and payments."
  ar: "تطبيق ورشة للخيّاطين المستقلين يعمل دون اتصال أولًا: الزبائن والمقاسات والطلبات والمدفوعات."
  ary: "تطبيق ديال الورشة للخيّاطة اللي خدامين بوحدهم، كيخدم حتى بلا كونيكسيون: الكليان، القياسات، الكوموندات والخلاص."
