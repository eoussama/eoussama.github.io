  en: an offline-first app for tailors, on the phone and the web.
  ar: تطبيق للخيّاطين يعمل دون اتصال، على الهاتف والويب.
  ary: تطبيق للخيّاطة كيخدم بلا كونيكسيون، ف التيليفون والويب.
  fr: une appli hors ligne pour tailleurs, sur mobile et web.
