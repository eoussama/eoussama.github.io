long:
  en: "Georize uses ground-penetrating radar (GPR) to see what lies under the ground without digging: buried pipes and cables, construction sites, hazards. Its one-page site introduces the company and the technology, puts its team a click away and shows where to find them in Rabat, in English, French and Spanish."
