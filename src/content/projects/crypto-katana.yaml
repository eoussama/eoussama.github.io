blurb:
  en: A landing page and an NFT marketplace for Crypto Katana, a play-to-earn game.
  ar: صفحة تعريفية وسوق NFT لـ Crypto Katana، لعبة «العب لتربح».
  ary: صفحة تعريفية وسوق ديال NFT ل Crypto Katana، لعبة play-to-earn.
  fr: Une page d’accueil et une place de marché NFT pour Crypto Katana, un jeu play-to-earn.
