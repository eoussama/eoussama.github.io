long:
  en: PockInv keeps a small shop’s stock on the phone, with or without a connection, and syncs when there is one. I built it first for two friends’ hardware stores.
  ar: يحفظ PockInv مخزون المحل الصغير على الهاتف، بالاتصال أو دونه، ويزامن متى توفّر الاتصال. بنيته أولًا لمحلَّي أدوات يملكهما صديقان لي.
  ary: PockInv كيخلّي الستوك ديال الحانوت الصغير ف التيليفون، بالكونيكسيون ولا بلا بيها، وكيزامن ملي كتكون. بنيتو الأول لجوج صحابي عندهم دروكري.
  fr: PockInv garde le stock d’un petit commerce sur le téléphone, avec ou sans connexion, et se synchronise dès qu’il y en a une. Je l’ai d’abord fait pour les quincailleries de deux amis.
  es: PockInv guarda el stock de una tienda pequeña en el móvil, con o sin conexión, y sincroniza cuando la hay. Lo hice primero para las ferreterías de dos amigos.
  it: PockInv tiene le scorte di un piccolo negozio sul telefono, con o senza connessione, e si sincronizza quando c’è. L’ho fatto prima per le ferramenta di due amici.
  ja: PockInvは小さな店の在庫をスマホで管理し、通信があってもなくても使え、つながったときに同期します。最初は友人ふたりの金物店のために作りました。
