blurb:
  en: An offline-first inventory app for small shops.
  ar: تطبيق جرد للمحلات الصغيرة يعمل دون اتصال أولًا.
  ary: تطبيق ديال الستوك للحوانت الصغار، كيخدم حتى بلا كونيكسيون.
  fr: Une appli d’inventaire hors ligne d’abord, pour les petits commerces.
  es: Una app de inventario para tiendas pequeñas, pensada para funcionar sin conexión.
  it: Un’app di inventario per piccoli negozi, pensata per funzionare offline.
  ja: 小さな店のための、オフラインファーストの在庫管理アプリ。
