blurb:
  en: Turns any file into a video of noise and back, so any video host can store files.
  ar: يحوّل أي ملف إلى فيديو من التشويش ثم يعيده، فيصبح أي موقع لاستضافة الفيديو مخزنًا للملفات.
  ary: كيحوّل أي ملف لفيديو ديال التشويش ويرجّعو، باش أي موقع ديال الفيديوهات يولّي يخبّي الملفات.
  fr: "Transforme n’importe quel fichier en vidéo de bruit, et inversement : tout hébergeur de vidéos devient un stockage de fichiers."
  es: Convierte cualquier archivo en un vídeo de ruido y viceversa, para que cualquier plataforma de vídeo guarde archivos.
  it: Trasforma qualsiasi file in un video di rumore e viceversa, così qualsiasi piattaforma video può conservare file.
  ja: どんなファイルもノイズの動画に変え、元に戻す。動画を置ける場所ならどこでもファイル置き場になる。
note:
