blurb:
  en: An app shell and an NFT marketplace template for Farm Planet.
  ar: هيكل تطبيق وقالب سوق NFT لـ Farm Planet.
  ary: هيكل ديال تطبيق وقالب ديال سوق NFT ل Farm Planet.
  fr: Une coquille d’application et un modèle de place de marché NFT pour Farm Planet.
  es: Un esqueleto de app y una plantilla de marketplace NFT para Farm Planet.
  it: Uno scheletro di app e un modello di marketplace NFT per Farm Planet.
  ja: Farm Planetのためのアプリのひな形と、NFTマーケットプレイスのテンプレート。
