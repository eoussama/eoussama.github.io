long:
  en: "A one-page site for Samadisa S.A.R.L, a construction company: a gallery of its finished work, a contact form, and the whole page in Spanish or French."
  ar: "موقع من صفحة واحدة لـ Samadisa S.A.R.L، شركة بناء: معرض لأعمالها المنجزة، واستمارة تواصل، والصفحة كلها بالإسبانية أو الفرنسية."
  ary: "سيت ف صفحة وحدة ل Samadisa S.A.R.L، شركة ديال البني: معرض ديال الخدمات اللي سالات، وفورمير ديال التواصل، والصفحة كاملة بالسبنيولية ولا بالفرنسية."
  fr: "Un site d’une page pour Samadisa S.A.R.L, une entreprise de construction : une galerie de ses réalisations, un formulaire de contact, et toute la page en espagnol ou en français."
  es: "Una web de una sola página para Samadisa S.A.R.L, una empresa de construcción: una galería de sus obras terminadas, un formulario de contacto y toda la página en español o francés."
  it: "Un sito di una pagina per Samadisa S.A.R.L, un’impresa di costruzioni: una galleria dei lavori finiti, un modulo di contatto e tutta la pagina in spagnolo o francese."
  ja: 建設会社Samadisa S.A.R.Lの1ページのサイト。施工実績のギャラリーと問い合わせフォームがあり、ページ全体をスペイン語かフランス語で表示できます。
