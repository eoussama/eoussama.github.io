blurb:
  en: Emmet, but for JavaScript.
  ar: مثل Emmet، لكن لـ JavaScript.
  ary: بحال Emmet، ولكن ل JavaScript.
  fr: Emmet, mais pour JavaScript.
  es: Emmet, pero para JavaScript.
  it: Emmet, ma per JavaScript.
  ja: JavaScript版のEmmet。
long:
  en: "temmejs builds DOM trees in JavaScript the way Emmet writes HTML: describe the structure briefly, get the elements."
  ar: "يبني temmejs أشجار DOM في JavaScript كما يكتب Emmet الـ HTML: صِف البنية باختصار، تحصل على العناصر."
  ary: "temmejs كيبني أشجار DOM ف JavaScript بحال كيفاش Emmet كيكتب HTML: وصف البنية باختصار، وتاخد العناصر."
  fr: "temmejs construit des arbres DOM en JavaScript comme Emmet écrit du HTML : décrivez brièvement la structure, obtenez les éléments."
  es: "temmejs construye árboles DOM en JavaScript como Emmet escribe HTML: describe la estructura en breve y obtén los elementos."
  it: "temmejs costruisce alberi DOM in JavaScript come Emmet scrive l’HTML: descrivi in breve la struttura, ottieni gli elementi."
  ja: temmejsは、EmmetがHTMLを書くようにJavaScriptでDOMツリーを組み立てます。構造を短く書けば、要素ができあがります。
