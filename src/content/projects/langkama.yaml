blurb:
  en: A small scripting language in the Nakama Realm’s own slang.
  ar: لغة برمجة نصية صغيرة بلهجة Nakama Realm الخاصة.
  ary: لغة سكريبت صغيرة بالهضرة الخاصة ديال Nakama Realm.
  fr: Un petit langage de script dans l’argot du Nakama Realm.
  es: Un pequeño lenguaje de scripts en la jerga propia del Nakama Realm.
  it: Un piccolo linguaggio di scripting nel gergo del Nakama Realm.
  ja: Nakama Realm独自のスラングで書く、小さなスクリプト言語。
