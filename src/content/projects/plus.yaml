long:
  en: Plus+ is a mobile app for watching live TV channels, built on IPTV playlists, with its own about, privacy, terms and copyright pages.
  ar: Plus+ تطبيق للهاتف لمشاهدة القنوات التلفزيونية مباشرة، مبنيّ على قوائم تشغيل IPTV، وله صفحاته الخاصة للتعريف والخصوصية والشروط وحقوق النشر.
  ary: Plus+ تطبيق ديال التيليفون باش تتفرج ف القنوات ديال التلفزة نيشان، مبني على البلايليستات ديال IPTV، وعندو الصفحات ديالو ديال التعريف، والخصوصية، والشروط، وحقوق النشر.
  fr: Plus+ est une appli mobile pour regarder des chaînes de télé en direct, construite sur des listes IPTV, avec ses propres pages à propos, confidentialité, conditions et droits d’auteur.
  es: Plus+ es una app móvil para ver canales de televisión en directo, basada en listas IPTV, con sus propias páginas de información, privacidad, términos y derechos de autor.
  it: Plus+ è un’app mobile per guardare canali TV in diretta, basata su playlist IPTV, con le sue pagine di informazioni, privacy, termini e copyright.
  ja: Plus+は、IPTVのプレイリストをもとにテレビの生放送を観るモバイルアプリです。概要、プライバシー、利用規約、著作権のページも備えています。
