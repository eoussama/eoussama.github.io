blurb:
  en: Live TV on the phone, over IPTV.
  ar: بثّ تلفزيوني مباشر على الهاتف، عبر IPTV.
  ary: التلفزة نيشان ف التيليفون، ب IPTV.
  fr: La télé en direct sur le téléphone, via IPTV.
  es: Televisión en directo en el móvil, por IPTV.
