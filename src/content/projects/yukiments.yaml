long:
  en: "The website of the Yukiments NFT project: its showcase, ecosystem, tokenomics, roadmap, partners and FAQs, among drifting clouds, rainbows and sparkles."
  ar: "موقع مشروع Yukiments من رموز NFT: معرضه، ومنظومته، واقتصاد رموزه، وخارطة طريقه، وشركاؤه، وأسئلته الشائعة، بين غيوم تنجرف وأقواس قزح وبريق."
  ary: "السيت ديال مشروع Yukiments ديال NFT: المعرض ديالو، والإيكوسيستم، والتوكنوميكس، والرود ماپ، والشركاء، والأسئلة اللي كتتعاود، وسط سحاب كيتحرك، وقوس قزح، ولمعان."
  fr: "Le site du projet NFT Yukiments : sa vitrine, son écosystème, sa tokenomics, sa feuille de route, ses partenaires et sa FAQ, parmi des nuages qui dérivent, des arcs-en-ciel et des étincelles."
  es: "La web del proyecto NFT Yukiments: su escaparate, su ecosistema, su tokenomics, su hoja de ruta, sus socios y sus preguntas frecuentes, entre nubes a la deriva, arcoíris y destellos."
  it: "Il sito del progetto NFT Yukiments: vetrina, ecosistema, tokenomics, roadmap, partner e FAQ, tra nuvole che scorrono, arcobaleni e scintille."
  ja: NFTプロジェクトYukimentsのウェブサイト。ショーケース、エコシステム、トークノミクス、ロードマップ、パートナー、よくある質問を、流れる雲と虹ときらめきの中に並べています。
