blurb:
  en: Drafts pathology reports from a few keywords and the pathologist’s voice.
  ar: يصوغ مسودات تقارير التشريح المرضي من بضع كلمات مفتاحية ومن صوت الطبيب.
  ary: كيكتب مسودات تقارير التشريح المرضي من شي كلمات مفتاحية ومن الصوت ديال الطبيب.
  fr: Rédige des comptes rendus d’anatomopathologie à partir de quelques mots-clés et de la voix du pathologiste.
  es: Redacta informes de anatomía patológica a partir de unas pocas palabras clave y la voz del patólogo.
  it: Redige referti di anatomia patologica da poche parole chiave e dalla voce del patologo.
  ja: いくつかのキーワードと病理医の声から、病理診断書の下書きを作る。
desc:
  en: drafts pathology reports for a hospital.
  ar: يصوغ تقارير التشريح المرضي لمستشفى.
  ary: كيكتب تقارير التشريح المرضي لسبيطار.
  fr: rédige les rapports de pathologie d’un CHU.
  es: redacta informes de patología para un hospital.
  it: redige referti di patologia per un ospedale.
  ja: 大学病院のために病理診断書の下書きを作る。
note:
  en: Private. My master’s final-year project, with CHU Mohammed VI Tanger.
  ar: خاص. مشروع تخرّجي في الماستر، مع المركز الاستشفائي الجامعي محمد السادس بطنجة.
  ary: خاص. مشروع التخرج ديالي ف الماستر، مع CHU محمد السادس ف طنجة.
  fr: Privé. Mon projet de fin d’études de master, avec le CHU Mohammed VI de Tanger.
  es: Privado. Mi proyecto de fin de máster, con el CHU Mohammed VI de Tánger.
  it: Privato. Il mio progetto di tesi magistrale, con il CHU Mohammed VI di Tangeri.
  ja: 非公開。修士の卒業制作で、タンジェのモハメッド6世大学病院（CHU）と共同。
long:
  en: "Pathologists write a long, structured report for every specimen. Patho Draft drafts it: from a few keywords it picks the template for that organ, fills it in, and takes dictation, and it keeps working offline. I built it as my master’s final-year project, for the good folks at CHU Mohammed VI Tanger."
