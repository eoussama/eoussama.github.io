long:
  en: A tool that drafts pathology reports, built as my master’s final-year project. The code is private, so this is a case study.
  ar: أداة تصوغ مسودات تقارير التشريح المرضي، بنيتها مشروعًا لتخرّجي في الماستر. الشيفرة خاصة، لذا هذه دراسة حالة.
  ary: أداة كتكتب مسودات تقارير التشريح المرضي، بنيتها كمشروع التخرج ديالي ف الماستر. الكود خاص، داكشي علاش هادي دراسة حالة.
  fr: Un outil qui rédige des brouillons de comptes rendus d’anatomopathologie, réalisé comme projet de fin d’études de master. Le code est privé, d’où cette étude de cas.
  es: Una herramienta que redacta borradores de informes de anatomía patológica, hecha como mi proyecto de fin de máster. El código es privado, así que esto es un caso de estudio.
  it: Uno strumento che redige bozze di referti di anatomia patologica, realizzato come progetto di tesi magistrale. Il codice è privato, quindi questo è un caso di studio.
  ja: 修士の卒業制作として作った、病理診断書の下書きを作るツール。コードは非公開なので、ケーススタディとして紹介します。
