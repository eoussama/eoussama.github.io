long:
  en: "Pathologists write a long, structured report for every specimen. Patho Draft drafts it: from a few keywords it picks the template for that organ, fills it in, and takes dictation, and it keeps working offline. I built it as my master’s final-year project, for the good folks at CHU Mohammed VI Tanger."
  ar: "يكتب أطباء التشريح المرضي تقريرًا طويلًا ومنظّمًا لكل عيّنة، وPatho Draft يصوغ مسودته: من بضع كلمات مفتاحية يختار قالب ذلك العضو ويملؤه، ويتلقّى الإملاء، ويواصل العمل دون اتصال. بنيته مشروعًا لتخرّجي في الماستر، للطيّبين في المركز الاستشفائي الجامعي محمد السادس بطنجة."
  ary: "أطباء التشريح المرضي كيكتبو تقرير طويل ومنظّم على كل عيّنة، وPatho Draft كيكتب ليهم المسودة: من شي كلمات مفتاحية كيختار القالب ديال داك العضو وكيعمّرو، وكيكتب داكشي اللي كتملي عليه، وكيبقى خدام حتى بلا كونيكسيون. بنيتو كمشروع التخرج ديالي ف الماستر، للناس الزوينين ف CHU محمد السادس ف طنجة."
  fr: "Les pathologistes rédigent un compte rendu long et structuré pour chaque prélèvement. Patho Draft en fait le brouillon : à partir de quelques mots-clés, il choisit le modèle de l’organe, le remplit et prend la dictée, et il continue de fonctionner hors ligne. Je l’ai réalisé comme projet de fin d’études de master, pour les belles personnes du CHU Mohammed VI de Tanger."
  es: "Los patólogos escriben un informe largo y estructurado para cada muestra. Patho Draft hace el borrador: con unas pocas palabras clave elige la plantilla de ese órgano, la rellena y toma dictado, y sigue funcionando sin conexión. Lo hice como proyecto de fin de máster, para la buena gente del CHU Mohammed VI de Tánger."
  it: "I patologi scrivono un referto lungo e strutturato per ogni campione. Patho Draft ne prepara la bozza: da poche parole chiave sceglie il modello per quell’organo, lo compila e prende la dettatura, e continua a funzionare offline. L’ho realizzato come progetto di tesi magistrale, per le brave persone del CHU Mohammed VI di Tangeri."
  ja: 病理医は検体ごとに長く構造化された診断書を書きます。Patho Draftはその下書きを作ります。いくつかのキーワードから臓器に合ったテンプレートを選んで埋め、口述も書き取り、オフラインでも動き続けます。修士の卒業制作として、タンジェのモハメッド6世大学病院（CHU）のみなさんのために作りました。
