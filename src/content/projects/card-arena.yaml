blurb:
  en: A card battle arena where players bet tokens on quick fights.
  ar: ساحة معارك بالبطاقات يراهن فيها اللاعبون برموز على مواجهات سريعة.
  ary: ساحة ديال المعارك بالكارطات فين اللاعبين كيراهنو بالتوكنز على معارك سريعة.
  fr: Une arène de combats de cartes où les joueurs misent des jetons sur des duels rapides.
  es: Una arena de batallas de cartas donde los jugadores apuestan tokens en peleas rápidas.
  it: Un’arena di battaglie di carte dove i giocatori scommettono token su sfide rapide.
  ja: プレイヤーがトークンを賭けて素早く戦う、カードバトルのアリーナ。
