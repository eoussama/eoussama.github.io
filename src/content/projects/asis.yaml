long:
  en: ASIS, the Augmented Strategic Intelligence System, is built for the Institut Royal des Études Stratégiques (IRES) in Rabat. It gathers the institute’s own material and approved outside sources in one controlled place. It supports monitoring, horizon scanning and analysis, and every brief, alert or report it drafts cites the sources behind it. It works in Arabic, French and English.
