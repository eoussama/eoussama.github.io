long:
  en: A filterscript that lets players buy, furnish and lock houses.
  ar: سكربت تصفية (filterscript) يتيح للاعبين شراء المنازل وتأثيثها وإقفالها.
  ary: filterscript كيخلّي اللاعبين يشريو الديور، ويفرشوهم، ويسدّوهم بالساروت.
  fr: Un filterscript qui permet aux joueurs d’acheter, de meubler et de verrouiller des maisons.
  es: Un filterscript que permite a los jugadores comprar, amueblar y cerrar con llave casas.
  it: Un filterscript che permette ai giocatori di comprare, arredare e chiudere a chiave le case.
  ja: プレイヤーが家を買い、家具を置き、鍵をかけられるフィルタースクリプト。
