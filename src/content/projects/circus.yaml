long:
  en: circus is the Nakama Realm’s web hub. Members sign in with Discord and find in one place the reminders the community’s bot keeps, the memes they upload, the games they play, the football matches they schedule and the pitches they play on, and a timeline of the group’s history, written by its historians. It also makes FUT-style player cards. Anyone with a Discord account can join.
