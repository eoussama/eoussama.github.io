  ar: مفتوح المصدر. Next.js على AWS، ومفتوح لكل من لديه حساب Discord. متاح على nakamaorg.vercel.app.
  ary: مفتوح المصدر. Next.js ف AWS، ومفتوح لأي واحد عندو Discord. كاين ف nakamaorg.vercel.app.
  fr: Open source. Next.js sur AWS, ouvert à toute personne ayant Discord. En ligne sur nakamaorg.vercel.app.
