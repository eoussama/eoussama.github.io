blurb:
  en: "The Nakama Realm’s members’ hub: reminders, memes, games, football matches and its own history."
  ar: "ملتقى أعضاء Nakama Realm: تذكيرات وميمز وألعاب ومباريات كرة قدم وتاريخه الخاص."
  ary: "البلاصة ديال أعضاء Nakama Realm: تذكيرات، ميمز، ألعاب، ماتشات ديال الكورة، والتاريخ ديالها."
  fr: "Le repaire des membres du Nakama Realm : rappels, mèmes, jeux, matchs de foot et sa propre histoire."
  es: "El punto de encuentro de los miembros del Nakama Realm: recordatorios, memes, juegos, partidos de fútbol y su propia historia."
