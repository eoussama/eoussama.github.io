long:
  en: eo-typewriterjs types, pauses and erases text on a page, one character at a time.
  ar: يكتب eo-typewriterjs النص على الصفحة ويتوقف ويمحوه، حرفًا حرفًا.
  ary: eo-typewriterjs كيكتب النص ف الصفحة، وكيوقف، وكيمسحو، حرف بحرف.
  fr: eo-typewriterjs tape, marque des pauses et efface du texte sur une page, un caractère à la fois.
  es: eo-typewriterjs escribe, pausa y borra texto en una página, carácter a carácter.
  it: eo-typewriterjs scrive, mette in pausa e cancella il testo su una pagina, un carattere alla volta.
  ja: eo-typewriterjsは、ページ上の文字を1文字ずつ打ち、止め、消します。
