blurb:
  en: A typewriter effect for JavaScript, on the go.
  ar: تأثير الآلة الكاتبة لـ JavaScript، جاهز للاستعمال.
  ary: تأثير ديال الماكينة ديال الكتابة ل JavaScript، واجد للاستعمال.
  fr: Un effet machine à écrire pour JavaScript, prêt à l’emploi.
  es: Un efecto de máquina de escribir para JavaScript, listo para usar.
