blurb:
  en: A Go client for the FreeStuff API, the data behind the free-games Discord bot.
  ar: عميل بلغة Go لواجهة FreeStuff البرمجية، مصدر بيانات بوت Discord للألعاب المجانية.
  ary: عميل ب Go ل API ديال FreeStuff، الداتا اللي ورا البوت ديال Discord ديال الألعاب الفابور.
  fr: Un client Go pour l’API FreeStuff, les données derrière le bot Discord des jeux gratuits.
  es: Un cliente en Go para la API de FreeStuff, los datos detrás del bot de Discord de juegos gratis.
  it: Un client Go per l’API di FreeStuff, i dati dietro il bot Discord dei giochi gratis.
  ja: 無料ゲームを知らせるDiscordボットの裏にある、FreeStuff APIのGoクライアント。
