blurb:
  en: Finds what KingOfLightning reacts to, and when, in streams over six hours long.
  ar: يجد ما يتفاعل معه KingOfLightning ومتى، في بثوث تتجاوز ست ساعات.
  ary: كيلقى شنو كيتفاعل معاه KingOfLightning وفوقاش، ف بثوث كيفوتو ست سوايع.
  fr: Retrouve à quoi réagit KingOfLightning, et à quel moment, dans des lives de plus de six heures.
  es: Encuentra a qué reacciona KingOfLightning, y cuándo, en directos de más de seis horas.
  it: Trova a cosa reagisce KingOfLightning, e quando, in live di oltre sei ore.
  ja: 6時間を超える配信の中で、KingOfLightningが何にいつリアクションしているかを見つける。
note:
  en: Open source. A browser extension for Chrome, Edge, Firefox and Safari, made for fans.
  ar: مفتوح المصدر. إضافة متصفح لـ Chrome وEdge وFirefox وSafari، صُنعت للمعجبين.
  ary: مفتوح المصدر. إضافة ديال المتصفح ل Chrome وEdge وFirefox وSafari، درتها للفانز.
  fr: Open source. Une extension pour Chrome, Edge, Firefox et Safari, faite pour les fans.
  es: Código abierto. Una extensión para Chrome, Edge, Firefox y Safari, hecha para los fans.
  it: Open source. Un’estensione per Chrome, Edge, Firefox e Safari, fatta per i fan.
  ja: オープンソース。ファンのために作った、Chrome、Edge、Firefox、Safari向けのブラウザ拡張機能。
long:
  en: Patreon takes down posts that name copyrighted shows, so the anime reactor KingOfLightning stopped naming them. This extension puts a panel under each post listing every reaction, when it starts and how long it lasts, and starts the video right there.
