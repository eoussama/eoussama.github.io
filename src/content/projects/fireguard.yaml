blurb:
  en: Firebase sign-in for browser extensions under Manifest V3, and the package that drives it.
  ar: تسجيل الدخول بـ Firebase لإضافات المتصفح في ظل Manifest V3، والحزمة التي تشغّله.
  ary: الدخول ب Firebase لإضافات المتصفح مع Manifest V3، والباكيج اللي كيحرّكو.
  fr: La connexion Firebase pour les extensions sous Manifest V3, et le paquet qui la pilote.
  es: Inicio de sesión con Firebase para extensiones con Manifest V3, y el paquete que lo maneja.
  it: L’accesso con Firebase per le estensioni con Manifest V3, e il pacchetto che lo guida.
  ja: Manifest V3のブラウザ拡張機能のためのFirebaseログインと、それを動かすパッケージ。
note:
  en: Open source. SvelteKit and TypeScript. Signs people in as a workaround for Chrome’s v3 manifest.
  ar: مفتوح المصدر. SvelteKit وTypeScript. يسجّل دخول المستخدمين للالتفاف على الإصدار الثالث من بيان Chrome.
  ary: مفتوح المصدر. SvelteKit وTypeScript. كيدخّل الناس كحل بديل للـ manifest v3 ديال Chrome.
  fr: Open source. SvelteKit et TypeScript. Connecte les utilisateurs pour contourner le manifest v3 de Chrome.
  es: Código abierto. SvelteKit y TypeScript. Inicia sesión como solución al manifiesto v3 de Chrome.
  it: Open source. SvelteKit e TypeScript. Fa accedere gli utenti aggirando il manifest v3 di Chrome.
  ja: オープンソース。SvelteKitとTypeScript。ChromeのManifest V3の回避策としてログインを担う。
long:
  en: Manifest V3 took the usual sign-in flow away from Chrome extensions. Fireguard is a small static page that signs the user in with Firebase in a popup or an iframe and hands the token back to the extension; Firemitt, an npm package, opens it, passes it the settings and waits for the result.
