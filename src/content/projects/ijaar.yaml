long:
  en: Ijaar is a property marketplace for Morocco, on the web and on mobile.
  ar: Ijaar سوق عقارية للمغرب، على الويب وعلى الهاتف.
  ary: Ijaar سوق ديال العقار ف المغرب، ف الويب وف التيليفون.
  fr: Ijaar est une place de marché immobilière pour le Maroc, sur le web et sur mobile.
  es: Ijaar es un portal inmobiliario para Marruecos, en la web y en el móvil.
  it: Ijaar è un portale immobiliare per il Marocco, sul web e su mobile.
  ja: Ijaarは、ウェブとモバイルで使えるモロッコの不動産マーケットプレイスです。
