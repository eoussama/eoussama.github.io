long:
  en: Swift TODO keeps a to-do list one click away. Click the toolbar icon or press a shortcut, type, press Enter and get back to what you were doing. It sorts to-dos into lists and tags, reads dates and repeats typed naturally (“call Sam tomorrow 3pm”), and has a Today view, a focus mode with a timer, and five skins in light and dark. Everything syncs through your browser account, with no server of its own.
